<script>
const W=256,H=192,PW=128;
const AB=[[0,0],[0,1],[1,0],[1,1]];
const AD_CS1=[[[0,0,0],[0,128,255],[255,128,0],[255,255,255]],[[0,0,0],[255,128,0],[0,128,255],[255,255,255]]];
const AD_CS0=[[[0,32,0],[0,96,0],[0,80,0],[0,255,0]],[[0,32,0],[0,80,0],[0,96,0],[0,255,0]]];

const PALETTE=[
  {name:'Black',rgb:[0,0,0],pat:'solid',c1:K,c2:K},{name:'White',rgb:[255,255,255],pat:'solid',c1:Wt,c2:Wt},
  {name:'Blue',rgb:[0,112,255],pat:'solid',c1:B,c2:B},{name:'Orange',rgb:[255,112,0],pat:'solid',c1:O,c2:O},
  {name:'Yellow',rgb:[255,200,100],pat:'checker',c1:O,c2:Wt},{name:'Cyan',rgb:[160,200,255],pat:'checker',c1:B,c2:Wt},
  {name:'Brown',rgb:[140,70,0],pat:'checker',c1:O,c2:K},{name:'DkBlue',rgb:[0,60,140],pat:'checker',c1:B,c2:K},
  {name:'Gray',rgb:[140,140,140],pat:'checker',c1:Wt,c2:K},{name:'Purple',rgb:[140,90,140],pat:'checker',c1:O,c2:B},
];
const PALETTE_PLUS=[...PALETTE,
  {name:'YellowH',rgb:[240,190,90],pat:'hstripe',c1:O,c2:Wt},{name:'CyanH',rgb:[140,190,240],pat:'hstripe',c1:B,c2:Wt},
  {name:'BrownH',rgb:[150,80,0],pat:'hstripe',c1:O,c2:K},{name:'DkBlueH',rgb:[0,70,150],pat:'hstripe',c1:B,c2:K},
  {name:'GrayH',rgb:[150,150,150],pat:'hstripe',c1:Wt,c2:K},{name:'PurpleH',rgb:[150,100,150],pat:'hstripe',c1:O,c2:B},
  {name:'YellowV',rgb:[230,180,80],pat:'vstripe',c1:O,c2:Wt},{name:'CyanV',rgb:[130,180,230],pat:'vstripe',c1:B,c2:Wt},
  {name:'BrownV',rgb:[130,60,0],pat:'vstripe',c1:O,c2:K},{name:'DkBlueV',rgb:[0,55,130],pat:'vstripe',c1:B,c2:K},
  {name:'GrayV',rgb:[130,130,130],pat:'vstripe',c1:Wt,c2:K},{name:'PurpleV',rgb:[130,80,130],pat:'vstripe',c1:O,c2:B},

const PAL_RGB=PALETTE.map(p=>p.rgb),PAL_PLUS_RGB=PALETTE_PLUS.map(p=>p.rgb);
function nPal(r,g,b,plus){const pal=plus?PAL_PLUS_RGB:PAL_RGB;let best=0,bestD=1e9;for(let i=0;i<pal.length;i++){const c=pal[i],d=(r-c[0])**2+(g-c[1])**2+(b-c[2])**2;if(d<bestD){bestD=d;best=i}}return best}
function n4(r,g,b){const ac=S.cs===0?AC_CS0:AC_CS1;let best=0,bestD=1e9;for(let j=0;j<4;j++){const c=ac[j],d=(r-c[0])**2+(g-c[1])**2+(b-c[2])**2;if(d<bestD){bestD=d;best=j}}return best}
function patternBit(pi,x,y,plus){const p=plus?PALETTE_PLUS[pi]:PALETTE[pi];const isEven=(x%2===0);let bc;
  if(p.pat==='solid')bc=p.c1;else if(p.pat==='checker')bc=((x+y)%2===0)?p.c1:p.c2;else if(p.pat==='hstripe')bc=(y%2===0)?p.c1:p.c2;else if(p.pat==='vstripe')bc=(x%2===0)?p.c1:p.c2;else bc=p.c1;

const DEF={aph:0,aon:true,cs:1,bl:50,br:0,co:20,ga:1.0,sat:120,rsz:'nearest',dth:'zone',dst:100,srp:true,pv:'converted',zm:2,ar:'4:3',fMed:0,fAvg:0,fBil:0,fHeq:false,fQuant:0,fPix:0,fNtsc:0,cropOn:false,cx1:0,cy1:0,cx2:255,cy2:191};
const S=Object.assign({img:null},JSON.parse(JSON.stringify(DEF)));
function clp(v){return Math.max(0,Math.min(255,Math.round(v)))}
function fMd(d,w,h,r){if(!r)return d;const o=new Uint8ClampedArray(d);for(let y=r;y<h-r;y++)for(let x=r;x<w-r;x++){const v=[[],[],[]];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const i=((y+dy)*w+(x+dx))*4;v[0].push(d[i]);v[1].push(d[i+1]);v[2].push(d[i+2])}const oi=(y*w+x)*4;for(let c=0;c<3;c++){v[c].sort((a,b)=>a-b);o[oi+c]=v[c][v[c].length>>1]}}return o}
function fAv(d,w,h,r){if(!r)return d;const o=new Uint8ClampedArray(d),sz=(r*2+1)**2;for(let y=r;y<h-r;y++)for(let x=r;x<w-r;x++){let sr=0,sg=0,sb=0;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const i=((y+dy)*w+(x+dx))*4;sr+=d[i];sg+=d[i+1];sb+=d[i+2]}const oi=(y*w+x)*4;o[oi]=sr/sz;o[oi+1]=sg/sz;o[oi+2]=sb/sz}return o}
function fBl(d,w,h,r){if(!r)return d;const o=new Uint8ClampedArray(d);for(let y=r;y<h-r;y++)for(let x=r;x<w-r;x++){let wr=0,wg=0,wb=0,ws=0;const ci=(y*w+x)*4,cr=d[ci],cg=d[ci+1],cb=d[ci+2];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const ni=((y+dy)*w+(x+dx))*4,gs=Math.exp(-(dx*dx+dy*dy)/(2*r*r)),dr=d[ni]-cr,dg=d[ni+1]-cg,db=d[ni+2]-cb,gr=Math.exp(-(dr*dr+dg*dg+db*db)/1800),ww=gs*gr;wr+=d[ni]*ww;wg+=d[ni+1]*ww;wb+=d[ni+2]*ww;ws+=ww}const oi=(y*w+x)*4;if(ws>0){o[oi]=wr/ws;o[oi+1]=wg/ws;o[oi+2]=wb/ws}}return o}
function fHe(d,w,h){const o=new Uint8ClampedArray(d);for(let c=0;c<3;c++){const hist=new Int32Array(256);for(let i=c;i<d.length;i+=4)hist[d[i]]++;const cdf=new Int32Array(256);cdf[0]=hist[0];for(let i=1;i<256;i++)cdf[i]=cdf[i-1]+hist[i];const mn=cdf.find(v=>v>0),tot=w*h;for(let i=c;i<d.length;i+=4)o[i]=clp((cdf[d[i]]-mn)/(tot-mn)*255)}return o}
function fQt(d,w,h,lv){if(!lv)return d;const o=new Uint8ClampedArray(d),n=Math.max(2,9-lv);for(let i=0;i<d.length;i+=4)for(let c=0;c<3;c++)o[i+c]=Math.round(d[i+c]/(255/(n-1)))*(255/(n-1));return o}
function fPx(d,w,h,sz){if(!sz)return d;const o=new Uint8ClampedArray(d),bs=sz+1;for(let by=0;by<h;by+=bs)for(let bx=0;bx<w;bx+=bs){let sr=0,sg=0,sb=0,cnt=0;for(let dy=0;dy<bs&&by+dy<h;dy++)for(let dx=0;dx<bs&&bx+dx<w;dx++){const i=((by+dy)*w+(bx+dx))*4;sr+=d[i];sg+=d[i+1];sb+=d[i+2];cnt++}sr/=cnt;sg/=cnt;sb/=cnt;for(let dy=0;dy<bs&&by+dy<h;dy++)for(let dx=0;dx<bs&&bx+dx<w;dx++){const i=((by+dy)*w+(bx+dx))*4;o[i]=sr;o[i+1]=sg;o[i+2]=sb}}return o}
function fNt(d,w,h,str){if(!str)return d;const o=new Uint8ClampedArray(d),r=str,k=[];let ks=0;for(let i=-r;i<=r;i++){const v=Math.exp(-(i*i)/(2*Math.max(1,r/2)**2));k.push(v);ks+=v}for(let i=0;i<k.length;i++)k[i]/=ks;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let rr=0,gg=0,bb=0;for(let j=0;j<k.length;j++){const sx=Math.max(0,Math.min(w-1,x+j-r)),i=(y*w+sx)*4;rr+=d[i]*k[j];gg+=d[i+1]*k[j];bb+=d[i+2]*k[j]}const oi=(y*w+x)*4;o[oi]=clp(rr);o[oi+1]=clp(gg);o[oi+2]=clp(bb)}return o}
let _prep,_bits,_out,_comp,_raw;
function preproc(){if(!S.img)return null;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingEnabled=S.rsz!=='nearest';x.imageSmoothingQuality=S.rsz==='lanczos'?'high':'medium';x.drawImage(S.img,0,0,W,H);let dd=x.getImageData(0,0,W,H).data;const br=S.br/100,co=S.co/100,ga=S.ga,sa=S.sat/100;const out=new Uint8ClampedArray(dd.length);for(let i=0;i<dd.length;i+=4){let r=dd[i]/255,g=dd[i+1]/255,b=dd[i+2]/255;r+=br;g+=br;b+=br;r=(r-.5)*(1+co)+.5;g=(g-.5)*(1+co)+.5;b=(b-.5)*(1+co)+.5;if(ga!==1){r=Math.pow(Math.max(0,r),1/ga);g=Math.pow(Math.max(0,g),1/ga);b=Math.pow(Math.max(0,b),1/ga)}if(sa!==1){const l=.299*r+.587*g+.114*b;r=l+sa*(r-l);g=l+sa*(g-l);b=l+sa*(b-l)}out[i]=clp(r*255);out[i+1]=clp(g*255);out[i+2]=clp(b*255);out[i+3]=255}let fd=out;fd=fMd(fd,W,H,S.fMed);fd=fAv(fd,W,H,S.fAvg);fd=fBl(fd,W,H,S.fBil);if(S.fHeq)fd=fHe(fd,W,H);fd=fQt(fd,W,H,S.fQuant);fd=fPx(fd,W,H,S.fPix);fd=fNt(fd,W,H,S.fNtsc);return _prep=new ImageData(new Uint8ClampedArray(fd),W,H)}
function convZone(s,plus){const bits=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;bits[y*W+x]=patternBit(nPal(s[i],s[i+1],s[i+2],plus),x,y,plus)}return bits}
function convED(s){const bits=new Uint8Array(W*H),k=EDK[S.dth]||EDK.floyd,ac=S.cs===0?AC_CS0:AC_CS1,eR=new Float32Array(W*H),eG=new Float32Array(W*H),eB=new Float32Array(W*H),str=S.dst/100;for(let y=0;y<H;y++){const rv=S.srp&&(y&1);for(let px=rv?PW-1:0;rv?px>=0:px<PW;px+=(rv?-1:1)){const x0=px*2,x1=x0+1,i0=y*W+x0,i1=i0+1;let r0=clp(s[i0*4]+eR[i0]),g0=clp(s[i0*4+1]+eG[i0]),b0=clp(s[i0*4+2]+eB[i0]),r1=clp(s[i1*4]+eR[i1]),g1=clp(s[i1*4+1]+eG[i1]),b1=clp(s[i1*4+2]+eB[i1]);let best=0,bestD=1e9;const ar=(r0+r1)/2,ag=(g0+g1)/2,ab=(b0+b1)/2;for(let j=0;j<4;j++){const c=ac[j],d=(ar-c[0])**2+(ag-c[1])**2+(ab-c[2])**2;if(d<bestD){bestD=d;best=j}}bits[i0]=AB[best][0];bits[i1]=AB[best][1];const ch=ac[best];for(const[pi,sr,sg,sb]of[[i0,r0,g0,b0],[i1,r1,g1,b1]]){const er=sr-ch[0],eg=sg-ch[1],eb=sb-ch[2],px2=pi%W;for(const[dx,dy,wt]of k.s){const nx=px2+(rv?-dx:dx),ny=y+dy;if(nx>=0&&nx<W&&ny>=0&&ny<H){const ni=ny*W+nx,f=wt/k.d*str*.5;eR[ni]+=er*f;eG[ni]+=eg*f;eB[ni]+=eb*f}}}}}return bits}

  document.getElementById('rsm')?.addEventListener('change',e=>{S.rsz=e.target.value;sched()});
  const bind=(id,key,xf,fmt)=>{const el=document.getElementById(id);if(!el)return;el.oninput=function(){S[key]=xf?xf(+this.value):+this.value;const v=document.getElementById('v'+id.slice(1));if(v)v.textContent=fmt?fmt(S[key]):S[key];sched()}};
  bind('rb','br');bind('rc','co');bind('rg','ga',v=>v/100,v=>v.toFixed(1));bind('rs','sat');bind('rds','dst',null,v=>v+'%');
  bind('rmed','fMed');bind('ravg','fAvg');bind('rbil','fBil');bind('rquant','fQuant');bind('rpix','fPix');bind('rntsc','fNtsc');
  const rbl=document.getElementById('rbl');if(rbl)rbl.oninput=function(){S.bl=+this.value;document.getElementById('vbl').textContent=S.bl+'%';renderBits()};
  const mkT=(id,key,cb)=>{const el=document.getElementById(id);if(!el)return;el.onclick=function(){this.classList.toggle('on');S[key]=this.classList.contains('on');if(cb)cb()}};
  mkT('tae','aon',()=>renderBits());mkT('theq','fHeq',sched);
  mkT('tcrop','cropOn',()=>{if(S.cropOn)startAnts();else{stopAnts();drawAnts()}});
  ['ccx1','ccy1','ccx2','ccy2'].forEach(id=>{const el=document.getElementById(id);if(!el)return;el.oninput=function(){S[id.replace('cc','c')]=+this.value;drawAnts();updCropInfo()}});
  document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const p=b.dataset.cp;if(p==='full'){S.cx1=0;S.cy1=0;S.cx2=255;S.cy2=191}else if(p==='top'){S.cx1=0;S.cy1=0;S.cx2=255;S.cy2=95}else if(p==='bot'){S.cx1=0;S.cy1=96;S.cx2=255;S.cy2=191}else if(p==='top3'){S.cx1=0;S.cy1=0;S.cx2=255;S.cy2=63}else if(p==='bot3'){S.cx1=0;S.cy1=128;S.cx2=255;S.cy2=191}document.getElementById('ccx1').value=S.cx1;document.getElementById('ccy1').value=S.cy1;document.getElementById('ccx2').value=S.cx2;document.getElementById('ccy2').value=S.cy2;S.cropOn=true;const t=document.getElementById('tcrop');if(t&&!t.classList.contains('on'))t.classList.add('on');startAnts();drawAnts();updCropInfo()});
  document.getElementById('ar43')?.addEventListener('click',()=>{S.ar='4:3';document.getElementById('ar43').classList.add('a');document.getElementById('ar11').classList.remove('a');fitZ()});
  document.getElementById('ar11')?.addEventListener('click',()=>{S.ar='1:1';document.getElementById('ar11').classList.add('a');document.getElementById('ar43').classList.remove('a');fitZ()});
  document.getElementById('bri')?.addEventListener('click',()=>document.getElementById('fi').click());
  document.getElementById('bex2')?.addEventListener('click',doExport);
  document.getElementById('bbatch')?.addEventListener('click',doBatch);
  updCropInfo();
}
let _dbt;function sched(){clearTimeout(_dbt);_dbt=setTimeout(runConvert,100)}
document.addEventListener('DOMContentLoaded',()=>{buildUI();
  document.getElementById('fi').onchange=e=>{if(e.target.files[0])loadImg(e.target.files[0])};
  document.getElementById('pfi').onchange=e=>{if(e.target.files[0])loadPrj(e.target.files[0])};
  const ws=document.getElementById('ws');
  ws.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
  ws.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])loadImg(e.dataTransfer.files[0])});
  document.getElementById('bo').onclick=()=>document.getElementById('fi').click();
  document.getElementById('bo3').onclick=()=>document.getElementById('fi').click();
  document.getElementById('bsv').onclick=savePrj;
  document.getElementById('bld').onclick=()=>document.getElementById('pfi').click();
  document.getElementById('bex').onclick=doExport;
  document.getElementById('brst').onclick=resetAll;
  document.getElementById('bzf').onclick=()=>{if(S.img)fitZ()};
  document.getElementById('bz1').onclick=()=>{S.zm=1;updSz();drawAnts()};
  ws.addEventListener('wheel',e=>{e.preventDefault();S.zm=Math.max(1,Math.min(16,S.zm+(e.deltaY>0?-1:1)));updSz();drawAnts()},{passive:false});
  window.addEventListener('resize',()=>{if(S.img){fitZ();drawAnts()}});
});
</script>
</body>
